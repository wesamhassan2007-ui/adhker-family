const defaults=[{id:'s',name:'الصلاة على محمد وآل محمد',target:100,unit:'مرة',frequency:'يومي',members:[...MEMBERS],owner:'بابا'},{id:'i',name:'الاستغفار',target:400,unit:'مرة',frequency:'يومي',members:[...MEMBERS],owner:'بابا'},{id:'q',name:'قراءة القرآن الكريم',target:10,unit:'آيات',frequency:'يومي',members:[...MEMBERS],owner:'بابا'}];
let db=load(),user=null,selected='بابا',editing=null,view='home';function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.goals))return x}catch{}return{goals:defaults,counts:{},pins:{},permissions:{},reminders:{}}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function day(){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}function week(){const d=new Date(day()+'T12:00:00Z');const n=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-n);return d.toISOString().slice(0,10)}function period(g){return g.frequency==='أسبوعي'?'W'+week():g.frequency==='مرة واحدة'?'ALL':day()}function countKey(m,g){return [m,g.id,period(g)].join('|')}function val(m,g){return db.counts[countKey(m,g)]||0}function h(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function flash(s){document.getElementById('message').textContent=s;setTimeout(()=>{const el=document.getElementById('message');if(el.textContent===s)el.textContent=''},4000)}
function drawPeople(){document.getElementById('people').innerHTML=MEMBERS.map(m=>`<button class="${m===selected?'primary':''}" onclick="selectPerson('${m}')">${m==='بابا'?`<img class='avatar' src='${BABA_PHOTO}' alt='صورة بابا'>`:`<span class='avatar placeholder'>${m.slice(0,1)}</span>`}<span>${m}${ADMINS.includes(m)?' 👑':''}</span></button>`).join('')}function selectPerson(m){selected=m;drawPeople()}function login(){const p=document.getElementById('pin').value;if(!/^\d{4}$/.test(p))return alert('أدخل 4 أرقام');if(db.pins[selected]&&db.pins[selected]!==p)return alert('رمز غير صحيح');if(!db.pins[selected]){if(!confirm('تعيين هذا الرمز للحساب '+selected+'؟'))return;db.pins[selected]=p;save()}user=selected;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');show('home')}function logout(){user=null;document.getElementById('pin').value='';document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');drawPeople()}function show(t){view=t;document.getElementById('who').textContent='أهلاً، '+user;const tabs=[['home','أذكاري'],['zahra','📿 تسبيح الزهراء'],['history','السجل']];if(ADMINS.includes(user))tabs.push(['admin','إدارة العائلة']);document.getElementById('nav').innerHTML=tabs.map(([k,n])=>`<button class="${k===t?'active':''}" onclick="show('${k}')">${n}</button>`).join('');for(const k of ['home','zahra','history','admin'])document.getElementById(k).classList.toggle('hidden',k!==t);if(t==='home')renderHome();if(t==='admin')renderAdmin();if(t==='history')renderHistory();if(t==='zahra')renderZahra()}
function add(gid,n){const g=db.goals.find(x=>x.id===gid);if(!g||!g.members.includes(user))return;const k=countKey(user,g);db.counts[k]=Math.max(0,(db.counts[k]||0)+n);save();renderHome()}
function manual(gid){const input=document.getElementById('manual_'+gid);const n=Number(input.value);if(!Number.isSafeInteger(n)||n<1)return alert('أدخل عدداً صحيحاً موجباً');add(gid,n)}
function renderHome(){const goals=db.goals.filter(g=>g.members.includes(user));const completed=goals.filter(g=>val(user,g)>=g.target).length;document.getElementById('home').innerHTML=`<div class="card"><h2>🌿 أذكاري اليوم</h2><p>أنجزت ${completed} من ${goals.length} أهداف</p><progress max="${goals.length||1}" value="${completed}"></progress></div>`+goals.map(g=>`<div class="card"><div class="row between"><strong>${h(g.name)}</strong><span class="pill">${h(g.frequency)}</span></div><p class="muted">الهدف: ${g.target} ${h(g.unit)}</p><div class="count">${val(user,g)}</div><progress max="${g.target}" value="${Math.min(val(user,g),g.target)}"></progress><p class="muted">${Math.round(val(user,g)/g.target*100)}% ${val(user,g)>g.target?'· زيادة '+(val(user,g)-g.target):''}</p><div class="row"><button class="primary" onclick="add('${g.id}',1)">+1 ذكر</button><button onclick="add('${g.id}',-1)">تصحيح −1</button><input style="width:95px" id="manual_${g.id}" type="number" min="1" placeholder="العدد"><button onclick="manual('${g.id}')">إضافة يدوياً</button></div></div>`).join('')+(completed===goals.length&&goals.length?'<div class="card note" style="text-align:center">﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾<p>بارك الله فيك، أتممت أهدافك!</p></div>':'')+`<div class="card"><h3>🔔 تذكيراتي الشخصية</h3><label>وقت التذكير المفضل</label><input id="remindTime" type="time" value="${db.reminders[user]||'09:00'}"><button onclick="db.reminders[user]=document.getElementById('remindTime').value;save();flash('حُفظ الوقت؛ الإشعارات الخارجية غير مفعلة في هذه النسخة')">حفظ الوقت</button><p class="muted">التذكير التلقائي الساعة 9 مساءً، وإشعارات الهاتف وواتساب، ستحتاج ربطاً بخدمة إشعارات في النسخة المتصلة.</p></div>`}
function renderAdmin(){if(!ADMINS.includes(user))return;document.getElementById('admin').innerHTML=`<div class="card"><h2>لوحة إدارة العائلة</h2><p class='muted'>بابا وماما مديران كاملان، ويمكن لكل منهما تعديل أهداف الآخر.</p><button class="primary" onclick="form()">+ إضافة هدف جديد</button><div id="formarea"></div></div><div class="card"><h3>الأهداف الحالية</h3>${db.goals.map(g=>`<div class="card"><strong>${h(g.name)}</strong><p>${g.target} ${h(g.unit)} · ${h(g.frequency)}</p><p class="muted">${g.members.map(h).join('، ')}</p><div class="row"><button onclick="form('${g.id}')">تعديل</button><button class="danger" onclick="removeGoal('${g.id}')">حذف</button></div></div>`).join('')}</div><div class="card"><h3>📊 متابعة العائلة اليوم</h3><div class="tablewrap"><table><thead><tr><th>الاسم</th><th>الأهداف المنجزة</th><th>نسبة الإكمال</th><th>تسبيح الزهراء</th><th>تذكير</th></tr></thead><tbody>${MEMBERS.map(m=>{const gs=db.goals.filter(g=>g.members.includes(m));const n=gs.filter(g=>val(m,g)>=g.target).length;const msg=gs.filter(g=>val(m,g)<g.target).map(g=>g.name+' (باقي '+(g.target-val(m,g))+')').join('، ');return `<tr><td>${m}</td><td>${n}/${gs.length}</td><td>${gs.length?Math.round(n/gs.length*100):0}%</td><td>${zRounds(m)}/${ZAHRA_TARGET}</td><td><button onclick="wa('${m}')">واتساب</button><span id="wa_${m}" class="hidden">${h(msg)}</span></td></tr>`}).join('')}</tbody></table></div><p class="muted">زر واتساب يفتح رسالة جاهزة للمشاركة يدوياً، ولا يرسلها تلقائياً.</p></div><div class="card"><h3>صلاحيات مشاهدة إنجازات العائلة</h3><p class="muted">بابا وماما يريان الجميع. الأعضاء الآخرون يرون إنجازاتهم فقط، ويمكن السماح لهم برؤية جدول المتابعة.</p>${MEMBERS.filter(m=>!ADMINS.includes(m)).map(m=>`<label><input type="checkbox" ${db.permissions[m]?'checked':''} onchange="db.permissions['${m}']=this.checked;save()"> السماح لـ${m} برؤية لوحة المتابعة</label>`).join('')}</div>`}
function form(id){editing=id||null;const g=db.goals.find(x=>x.id===id)||{name:'',target:100,unit:'مرة',frequency:'يومي',members:[...MEMBERS]};document.getElementById('formarea').innerHTML=`<div class="card"><h3>${id?'تعديل الهدف':'إضافة هدف'}</h3><label>اسم الذكر أو العمل</label><input class="wide" id="gname" value="${h(g.name)}" placeholder="مثلاً قراءة دعاء العهد"><label>العدد المطلوب</label><input id="gtarget" type="number" min="1" value="${g.target}"><label>الوحدة</label><select id="gunit">${['مرة','آيات','دقائق','صفحات','عمل'].map(u=>`<option ${u===g.unit?'selected':''}>${u}</option>`).join('')}</select><label>التكرار</label><select id="gfreq">${['يومي','أسبوعي','مرة واحدة'].map(f=>`<option ${f===g.frequency?'selected':''}>${f}</option>`).join('')}</select><label>الأشخاص المكلّفون</label><div class="checklist">${MEMBERS.map(m=>`<label><input class="gmember" type="checkbox" value="${m}" ${g.members.includes(m)?'checked':''}> ${m}</label>`).join('')}</div><div class="row" style="margin-top:15px"><button class="primary" onclick="saveGoal()">حفظ الهدف</button><button onclick="document.getElementById('formarea').innerHTML=''">إلغاء</button></div></div>`;document.getElementById('gname').focus()}
function saveGoal(){const name=document.getElementById('gname').value.trim(),target=Number(document.getElementById('gtarget').value),unit=document.getElementById('gunit').value,frequency=document.getElementById('gfreq').value,members=[...document.querySelectorAll('.gmember:checked')].map(x=>x.value);if(!name||!Number.isSafeInteger(target)||target<1||!members.length)return alert('أدخل اسماً وعدداً صحيحاً واختر شخصاً على الأقل');if(editing){const g=db.goals.find(x=>x.id===editing);Object.assign(g,{name,target,unit,frequency,members})}else db.goals.push({id:'g'+Date.now(),name,target,unit,frequency,members,owner:user});save();renderAdmin();flash('تم حفظ الهدف')}
function removeGoal(id){if(!confirm('حذف هذا الهدف؟ ستبقى السجلات الرقمية محفوظة محلياً ولكن لن تظهر في الواجهة.'))return;db.goals=db.goals.filter(g=>g.id!==id);save();renderAdmin();flash('تم الحذف')}
function wa(m){const gs=db.goals.filter(g=>g.members.includes(m)&&val(m,g)<g.target);const message=gs.length?`السلام عليكم ${m}، تذكير لطيف بأذكارك المتبقية: \n`+gs.map(g=>`• ${g.name}: باقي ${g.target-val(m,g)} ${g.unit}`).join('\n')+'\nبارك الله فيك 🌿':`ما شاء الله ${m}، أتممت أهدافك!`;window.open('https://wa.me/?text='+encodeURIComponent(message),'_blank','noopener')}
function renderHistory(){const dates=Array.from({length:14},(_,i)=>{const d=new Date(day()+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-i);return d.toISOString().slice(0,10)});let html=`<div class="card"><h2>سجل الإنجازات</h2><p class="muted">آخر 14 يوماً للأهداف اليومية</p><div class="tablewrap"><table><tr><th>التاريخ</th><th>الذكر</th><th>المنجز</th><th>الهدف</th></tr>`;for(const date of dates){for(const g of db.goals.filter(x=>x.frequency==='يومي'&&x.members.includes(user))){const n=db.counts[[user,g.id,date].join('|')]||0;html+=`<tr><td>${date}</td><td>${h(g.name)}</td><td>${n}</td><td>${g.target}</td></tr>`}html+=`<tr><td>${date}</td><td>📿 تسبيح الزهراء (ع)</td><td>${db.counts[[user,'zahra',date].join('|')]||0}</td><td>${ZAHRA_TARGET}</td></tr>`}html+='</table></div></div>';if(!ADMINS.includes(user)&&db.permissions[user])html+=`<div class="card"><h3>إنجاز العائلة اليوم</h3>${MEMBERS.map(m=>{const gs=db.goals.filter(g=>g.members.includes(m));return `<p>${m}: ${gs.filter(g=>val(m,g)>=g.target).length} من ${gs.length} أهداف</p>`}).join('')}</div>`;document.getElementById('history').innerHTML=html}
drawPeople();


const ZAHRA=[{t:'اللهُ أكبر',n:34},{t:'الحمدُ لله',n:33},{t:'سبحانَ الله',n:33}],ZAHRA_TARGET=5;
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function zKey(m,d){return [m,'zahra',d||day()].join('|')}
function zRounds(m){return db.counts[zKey(m)]||0}
function zState(){db.zahra=db.zahra||{};let s=db.zahra[user];if(!s||s.date!==day())s=db.zahra[user]={date:day(),stage:0,n:0};return s}
function zTap(){const s=zState();s.n++;if(s.n>=ZAHRA[s.stage].n){s.stage++;s.n=0;if(s.stage>=ZAHRA.length){s.stage=0;db.counts[zKey(user)]=zRounds(user)+1;vib([90,60,90,60,250]);save();renderZahra();flash('تقبّل الله، أتممت تسبيح السيدة الزهراء (ع) 🌸');return}vib([60,40,60])}else vib(15);save();renderZahra()}
function zUndo(){const s=zState();if(s.n>0)s.n--;else if(s.stage>0){s.stage--;s.n=ZAHRA[s.stage].n-1}else return;save();renderZahra()}
function zReset(){const s=zState();if(!s.n&&!s.stage)return;if(!confirm('إعادة التسبيحة الحالية من البداية؟'))return;s.stage=0;s.n=0;save();renderZahra()}
function zRoundFix(d){const k=zKey(user);db.counts[k]=Math.max(0,zRounds(user)+d);save();renderZahra()}
function renderZahra(){const s=zState(),cur=ZAHRA[s.stage],rounds=zRounds(user),done=s.stage*0+ZAHRA.slice(0,s.stage).reduce((a,x)=>a+x.n,0)+s.n;
document.getElementById('zahra').innerHTML=`<div class="card zcard"><h2>📿 تسبيح السيدة الزهراء (ع)</h2><p class="muted">اضغط على الدائرة مع كل تسبيحة؛ ينتقل العدّاد تلقائياً بين المراحل.</p><div class="zstages">${ZAHRA.map((x,i)=>`<span class="zstage ${i<s.stage?'done':i===s.stage?'cur':''}">${i<s.stage?'✓ ':''}${x.t} ${x.n}</span>`).join('')}</div><button class="zbtn" onclick="zTap()" aria-label="تسبيحة"><span class="zt">${cur.t}</span><span class="zn">${s.n}</span><span class="zof">من ${cur.n}</span></button><progress max="100" value="${done}"></progress><p class="muted">${done} / 100 في هذه التسبيحة</p><div class="row" style="justify-content:center"><button onclick="zUndo()">تراجع −1</button><button class="danger" onclick="zReset()">إعادة من البداية</button></div></div><div class="card"><div class="row between"><h3 style="margin:0">تسبيحات اليوم</h3><span class="pill">بعد كل صلاة</span></div><div class="count">${rounds} <small>/ ${ZAHRA_TARGET}</small></div><progress max="${ZAHRA_TARGET}" value="${Math.min(rounds,ZAHRA_TARGET)}"></progress><div class="row" style="justify-content:center;margin-top:10px"><button onclick="zRoundFix(1)">+1 تسبيحة كاملة</button><button onclick="zRoundFix(-1)">تصحيح −1</button></div><p class="muted">يُصفَّر العداد كل يوم، ويُحفظ عدد التسبيحات في السجل.</p></div>`}

const AVATARS={'بابا':BABA_PHOTO};
function renderFamilyDashboard(){
 const place=document.getElementById('familyDashboard');if(!place)return;
 const avatars=typeof AVATARS!=='undefined'?AVATARS:{};
 place.innerHTML='<div class="dashboard-head">🌙 معاً على ذكر الله · إنجازات العائلة اليوم</div><div class="dashboard-grid">'+MEMBERS.map(m=>{const gs=db.goals.filter(g=>g.members.includes(m));const done=gs.filter(g=>val(m,g)>=g.target).length;const pct=gs.length?Math.round(done/gs.length*100):0;const av=avatars[m];const photo=av?'<img alt="'+h(m)+'" src="'+av+'">':'<span class="circle">'+({'ماما':'🌷','علي':'👦','يسرى':'🌸','زهراء':'🌼','بتول':'🌺'}[m]||'🌿')+'</span>';return '<div class="family-tile">'+photo+'<div class="info"><strong>'+h(m)+'</strong><div class="ratio"><span>'+done+' / '+gs.length+'</span><b>'+pct+'%</b></div><progress max="100" value="'+pct+'"></progress></div></div>'}).join('')+'</div>';
}
const originalRenderHome=renderHome;
renderHome=function(){originalRenderHome();const home=document.getElementById('home');const zr=zRounds(user);home.insertAdjacentHTML('afterbegin',`<div class="card zmini"><div><strong>📿 تسبيح الزهراء (ع)</strong><div class="muted">${zr} من ${ZAHRA_TARGET} اليوم</div></div><button class="primary" onclick="show('zahra')">افتح العدّاد</button></div>`);if(ADMINS.includes(user)){home.insertAdjacentHTML('afterbegin','<div id="familyDashboard"></div>');renderFamilyDashboard();}};
</script></body></html>
